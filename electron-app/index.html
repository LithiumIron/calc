<!DOCTYPE html>
<html lang="en">
  <head> 
    <meta charset="UTF-8" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="title-bar">
      <button class="minimize" onclick="minimizeApp()">─</button>
      <button class="exit" onclick="closeApp()">✕</button>
    </div>

    <div class="calculator">
      <input type="text" id="display" readonly>
      <div class="keys">
        
        <button onclick="appendToDisplay('^2')" class="operator">x²</button>
        <button onclick="appendToDisplay('√')" class="operator">√</button>
        <button onclick="clearDisplay()" class="operator">C</button>
        <button onclick="deleteLast()" class="operator"><<</button>

        <button onclick="appendToDisplay('^')" class="operator">xʸ</button>
        <button onclick="appendToDisplay('(')" class="operator">(</button>
        <button onclick="appendToDisplay(')')" class="operator">)</button>
        <button onclick="appendToDisplay('/')" class="operator">/</button>
        

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('+')" class="operator">+</button>
       
        
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('-')" class="operator">-</button>
        
       
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
         <button onclick="appendToDisplay('*')" class="operator">x</button>
       
        <button onclick="appendToDisplay('π')" class="operator">π</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="calculate('')" class="equal">=</button>
        
        
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
